[package]
name = "heirloom"
description = "Heirloom: the family archive app (Tauri window)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_app` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "heirloom_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
heirloom-api = { path = "../crates/heirloom-api" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
